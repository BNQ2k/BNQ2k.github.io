    />

  <body>
    <!---------------->
    <!-- Navigation -->

    <nav>
      <ul>
        <li><a href="" id="logo">KIVIGYM</a></li>
        <li>
          <a href="index.html" class="selected navlink">Koti</a>
        </li>
        <li>
          <a href="bmi.html" class="navlink">Painoindeksi</a>
        </li>
        <li>
          <a href="viikkotehtavat.html" class="navlink">Yhteystiedot</a>

        <li>
          <a href="paivakirja.html" class="navlink">...</a>
        </li>
        <li>
        <a href="mittaukset.html" class="navlink">Mittaukset</a>
        </li>

        <div class="user-info">
  Kirjautuneena: <span class="username">vieras</span>
  <a href="login.html" id="login-link" style="margin-left: 10px;">Kirjaudu sisään</a>
  <button id="logout-btn" style="display: none; margin-left: 10px;">Kirjaudu ulos</button>
</div>
    </nav>

    <main>
      <h2>Lisää uusi merkintä</h2>
      <section class="add-entry-form">
        <form id="add-entry-form">
          <input type="date" id="date" required>
          <input type="number" id="weight" placeholder="Paino (kg)" step="0.1">
          <input type="number" id="sleep" placeholder="Uni (h)">
          <input type="text" id="mood" placeholder="Fiilis">
          <button type="submit">Tallenna merkintä</button>
        </form>
      </section>

      <hr>

      <h2>Päiväkirjahaku</h2>
      <button class="get_entries">Hae päiväkirjamerkinnät</button>

      <section class="diary-card-area"></section>
    </main>
    <footer>
      <p>Copyright by @Benkku</p>
    </footer>

    <dialog class="diary_dialog">
      <h2>Tässä on dialogi</h2>
      <div class="diary_id">ID</div>
      <button autofocus>Close</button>
    </dialog>
  </body>
  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/diary.js"></script>
